<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaser — Invoices</title>
<style>
:root{font:16px system-ui,sans-serif;color:#14213d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:32px auto;padding:0 18px}.card{background:white;border:1px solid #dfe3ea;border-radius:12px;padding:20px;margin:16px 0}.hidden{display:none!important}.login{max-width:440px;margin:12vh auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:5px;margin:10px 0;font-weight:600}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:7px}button{cursor:pointer;background:#0b6e6e;color:white;border:0;font-weight:700;margin:4px 4px 4px 0}.secondary{background:#e8eefb;color:#294b9b}.danger{background:#b42318}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.invoice{border:1px solid #e4e7ec;padding:12px;border-radius:8px;margin:8px 0}.muted{color:#667085}.error{color:#b42318}.success{color:#067647}.code{overflow-wrap:anywhere;background:#f4f4f4;padding:10px;border-radius:6px}textarea{min-height:70px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section id="auth" class="card login"><h1>Chaser</h1><p class="muted">Invoices Claude writes. Chaser chases.</p>
<form id="login"><h2>Sign in</h2><label>Username<input name="username" value="demo" required></label><label>Password<input name="password" type="password" value="demo1234" required></label><button>Sign in</button><div id="loginError" class="error"></div></form>
<hr><form id="signup"><h2>Create account</h2><label>Username<input name="username" required minlength="3"></label><label>Password<input name="password" type="password" required minlength="6"></label><button class="secondary">Create account</button><div id="signupError" class="error"></div></form></section>
<section id="app" class="hidden"><header class="row"><div><h1>Chaser</h1><span id="welcome" class="muted"></span></div><button id="logout" class="danger">Log out</button></header>
<div class="grid"><section class="card"><h2>Invoices</h2><div id="invoices"></div></section><section class="card"><h2>Business profile</h2><form id="profile"><label>Business name<input name="business_name"></label><label>Email<input name="email" type="email"></label><label>Address<textarea name="address"></textarea></label><label>Payment information<textarea name="payment_info"></textarea></label><label>Automatic reminders<select name="auto_reminders"><option value="true">On</option><option value="false">Off</option></select></label><button>Save profile</button></form><h3>Connect Claude (MCP)</h3><div id="mcp" class="code"></div><button id="rotate" class="secondary">Generate new link</button></section></div>
<section class="card"><h2>Create invoice</h2><form id="invoice"><div class="row"><label>Client name<input name="client_name" required></label><label>Client email<input name="client_email" type="email"></label></div><div class="row"><label>Issue date<input name="issue_date" type="date"></label><label>Due date<input name="due_date" type="date"></label></div><div class="row"><label>Currency<select name="currency"><option>INR</option><option>USD</option><option>EUR</option></select></label><label>Tax rate %<input name="tax_rate" type="number" min="0" max="100" value="18"></label></div><label>Item description<input name="description" required></label><div class="row"><label>Quantity<input name="quantity" type="number" min="0.01" step="0.01" value="1" required></label><label>Unit price<input name="unit_price" type="number" min="0" step="0.01" required></label></div><label>Notes<textarea name="notes"></textarea></label><button>Save draft</button><span id="invoiceMessage"></span></form></section></section>
</main><script>
const $=id=>document.getElementById(id);let me;
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error||'Request failed');return d}
function formData(form){return Object.fromEntries(new FormData(form))}
async function load(){me=await api('/api/me');$('welcome').textContent='Signed in as '+me.username;for(const k of ['business_name','email','address','payment_info'])$('profile').elements[k].value=me.profile[k]||'';$('profile').elements.auto_reminders.value=String(me.profile.auto_reminders!==false);$('mcp').textContent=me.mcp_url;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await list()}
async function list(){const a=await api('/api/invoices');$('invoices').innerHTML='';for(const i of a){const el=document.createElement('article');el.className='invoice';const title=document.createElement('strong');title.textContent=`${i.number} — ${i.client_name}`;const info=document.createElement('p');info.textContent=`${i.status_effective} · ${i.currency} ${i.totals.total.toFixed(2)} · due ${i.due_date}`;el.append(title,info);const link=document.createElement('a');link.href=i.public_url;link.textContent='Client invoice link';link.target='_blank';el.append(link,document.createTextNode(' '));for(const [action,label] of [['send','Send'],['remind','Remind'],['paid','Mark paid']]){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.onclick=async()=>{try{await api(`/api/invoices/${i.id}/${action}`,{method:'POST'});await list()}catch(e){alert(e.message)}};el.append(b)}$('invoices').append(el)}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify(formData(e.target))});await load()}catch(x){$('loginError').textContent=x.message}};
$('signup').onsubmit=async e=>{e.preventDefault();try{await api('/api/signup',{method:'POST',body:JSON.stringify(formData(e.target))});await load()}catch(x){$('signupError').textContent=x.message}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
$('profile').onsubmit=async e=>{e.preventDefault();const d=formData(e.target);d.auto_reminders=d.auto_reminders==='true';try{me=await api('/api/profile',{method:'PUT',body:JSON.stringify(d)});$('mcp').textContent=me.mcp_url}catch(x){alert(x.message)}};
$('rotate').onclick=async()=>{me=await api('/api/token/regenerate',{method:'POST'});$('mcp').textContent=me.mcp_url};
$('invoice').onsubmit=async e=>{e.preventDefault();const d=formData(e.target);d.tax_rate=Number(d.tax_rate);d.quantity=Number(d.quantity);d.unit_price=Number(d.unit_price);d.items=[{description:d.description,quantity:d.quantity,unit_price:d.unit_price}];delete d.description;delete d.quantity;delete d.unit_price;try{await api('/api/invoices',{method:'POST',body:JSON.stringify(d)});$('invoiceMessage').textContent='Draft saved';e.target.reset();e.target.elements.tax_rate.value=18;await list()}catch(x){$('invoiceMessage').textContent=x.message}};
load().catch(()=>{});
</script></body></html>
